<!doctype html>
<html lang="fr">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ressources de cours</title>
<style>
:root{--bg:#f4f3ef;--surface:#fff;--line:#dedcd4;--ink:#141513;--ink-2:#5b5e57;--fin:#1f7a45;--fin-soft:#dcefe2;--monde:#2f5fa8;--monde-soft:#dfe8f6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e0f0d;--surface:#181a17;--line:#2b2e29;--ink:#eeefe9;--ink-2:#a5a99f;--fin:#c6f432;--fin-soft:#263015;--monde:#8fb4f0;--monde-soft:#18233a}}
:root[data-theme="dark"]{--bg:#0e0f0d;--surface:#181a17;--line:#2b2e29;--ink:#eeefe9;--ink-2:#a5a99f;--fin:#c6f432;--fin-soft:#263015;--monde:#8fb4f0;--monde-soft:#18233a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:560px;display:grid;gap:14px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
h1{font-size:clamp(30px,8vw,42px);line-height:1.05;letter-spacing:-.03em;margin:4px 0 10px}
a.c{display:flex;align-items:center;gap:16px;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit}
a.c:active{transform:scale(.98)}
.ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none}
.c b{display:block;font-size:18px;letter-spacing:-.01em}
.c span{color:var(--ink-2);font-size:14px}
.go{margin-left:auto;font-size:22px;color:var(--ink-2)}
.fin .ic{background:var(--fin-soft)} .fin b{color:var(--ink)}
.monde{opacity:.55;pointer-events:none}.monde .ic{background:var(--monde-soft)}
.pill{margin-left:auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;background:var(--line);color:var(--ink-2)}
footer{color:var(--ink-2);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main>
  <div>
    <p class="eyebrow">Secondaire 5</p>
    <h1>Ressources de cours</h1>
  </div>
  <a class="c fin" href="finances/"><div class="ic">💸</div><div><b>Éducation financière</b><span>Notes de cours, examens à venir, quoi étudier</span></div><span class="go">›</span></a>
  <a class="c monde" aria-disabled="true"><div class="ic">🌍</div><div><b>Monde contemporain</b><span>Notes de cours et examens</span></div><span class="pill">Bientôt</span></a>
  <footer>Aucun compte, aucun cookie, aucune statistique de visite.</footer>
</main>
</body>
</html>
